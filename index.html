<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>[hidden]{display:none!important}</style></head><body><title>Le Premier Feu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout : monde 3D plein écran ; HUD en panneaux de peau tannée collés aux bords ; pouvoirs en bas, à portée de pouce. Thème unique sombre (jeu). */
:root{
  --bark: rgba(30,23,16,.84);
  --bark-solid:#1d1711;
  --bark-raised:#2a2118;
  --edge: rgba(239,226,200,.14);
  --bone:#f0e6d0;
  --bone-dim:#b8aa8e;
  --ochre:#e3a03f;
  --ember:#e5653a;
  --moss:#9cc061;
  --spirit:#86c6d4;
  --blight:#b4cf4f;
  --gold:#f2d06b;
  --display:"Alegreya Sans SC", "Trebuchet MS", sans-serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bark-solid);color:var(--bone);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.hud{position:fixed;z-index:2}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* --- barre du haut --- */
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;pointer-events:none}
#top>.speed,.hudchips>*{pointer-events:auto}
/* les pastilles passent à la ligne à gauche ; la vitesse reste en haut à droite */
.hudchips{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;padding-right:212px;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bark);border:1px solid var(--edge);border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;line-height:1}
.chip b{font-weight:700}
.chip small{color:var(--bone-dim);font-size:12px;margin-left:-3px}
.clock{font-family:var(--display);letter-spacing:.04em}
.clock span{color:var(--bone-dim)}
.c-food svg{color:#e0605a}.c-wood svg{color:#c08a55}.c-pop svg{color:var(--bone)}.c-mood svg{color:var(--gold)}.c-know svg{color:var(--ochre)}
.mana svg{color:var(--spirit)}
.mbar{width:64px;height:7px;border-radius:4px;background:rgba(134,198,212,.18);overflow:hidden}
.mbar i{display:block;height:100%;width:50%;background:var(--spirit);border-radius:4px;transition:width .3s}
.speed{position:absolute;top:0;right:0;padding:3px;gap:2px}
.speed button{min-width:34px;height:28px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--bone-dim)}
.speed button.on{background:var(--ochre);color:#2a1c0c}
.speed #musicbtn{color:var(--ochre);font-size:17px;margin-left:4px;border-left:1px solid var(--edge);border-radius:0 7px 7px 0}
.speed #musicbtn.off{color:var(--bone-dim);opacity:.55;text-decoration:line-through}

/* --- étiquettes des villageois --- */
#labels{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.vicon{position:absolute;left:0;top:0;font-size:18px;line-height:1;padding:2px 3px;border-radius:9px;background:rgba(28,22,16,.55);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.vl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:2px 7px 2px 4px;border-radius:999px;background:rgba(22,16,11,.66);color:var(--bone);font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;will-change:transform}
.vl i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(240,230,208,.5)}
.vl.kid{font-size:10.5px;font-weight:500}
.vl.sick{color:var(--blight)}
.vl.sel{background:var(--ochre);color:#2a1c0c}

/* --- portraits, fiche, histoire, tribu --- */
svg.pt{display:block;border-radius:50%;overflow:hidden;flex:none}
svg.pt.dead{filter:grayscale(1) brightness(.8)}
#cport svg{width:46px;height:46px}
.cid{display:grid;gap:2px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chips span{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(227,160,63,.14);color:var(--ochre);font-weight:700}
.chips span.tp{background:rgba(134,198,212,.12);color:var(--spirit)}
.cact{display:flex;gap:6px;margin-top:10px}
.cact button{flex:1;font-size:13.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--edge);font-weight:700}
.cact #cstory{background:var(--ochre);color:#2a1c0c;border-color:var(--ochre)}
.cact button.on{background:rgba(227,160,63,.2);border-color:var(--ochre);color:var(--ochre)}
.sthead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sthead svg.pt{width:84px;height:84px}
.sthead h2{margin:0}
.sthead .eyebrow{margin:0 0 4px!important;letter-spacing:.06em}
.traits{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:0 0 12px}
.trait{padding:9px 11px;border-radius:10px;background:var(--bark-raised);border:1px solid var(--edge);display:grid;gap:2px}
.trait b{font-family:var(--display);font-size:16px;color:var(--ochre)}
.trait.tp b{color:var(--spirit)}
.trait span{font-size:13px;color:var(--bone-dim);line-height:1.3}
.family{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 12px}
.family>span{color:var(--bone-dim);font-family:var(--display);letter-spacing:.06em;font-size:13px}
.plink{color:var(--ochre);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.plink.dead{color:var(--bone-dim)}
.panel h3.sec{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--bone-dim);margin:14px 0 7px;font-weight:700}
.journal{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:220px;overflow:auto;font-size:14px}
.journal li{display:grid;grid-template-columns:38px 1fr;gap:6px;line-height:1.35}
.journal time{color:var(--bone-dim);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.roster{display:grid;gap:6px;margin-top:8px}
.clist{margin:4px 0 4px;padding-left:20px;display:grid;gap:4px;line-height:1.4}.clist li::marker{color:var(--ochre)}
.chart{display:block;width:100%;max-width:460px;height:auto;margin:2px auto 6px}
.sbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 30px;align-items:center;gap:8px;font-size:13px;margin:3px 0}.sbar i{display:block;height:9px;border-radius:5px}.sbar b{text-align:right;font-variant-numeric:tabular-nums}
.btn.small{padding:4px 10px;font-size:12px;margin-left:6px}
.rrow{display:grid;grid-template-columns:44px 1fr;column-gap:10px;row-gap:2px;align-items:center;text-align:left;padding:8px 10px;border-radius:10px;background:var(--bark-raised);border:1px solid var(--edge)}
.rrow svg.pt{width:44px;height:44px;grid-row:span 2}
.rrow .rn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.rrow .rn b{font-family:var(--display);font-size:17px}
.rrow .rn small{color:var(--bone-dim);font-size:12.5px}
.rrow .rt{font-size:12.5px;color:var(--bone-dim);min-width:0}
.rrow:hover{border-color:var(--ochre)}
.anc{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px;color:var(--bone-dim)}

/* --- art pariétal : paroi de grotte éclairée à la torche --- */
.wall{position:relative;border-radius:14px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;margin:4px 0 12px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,rgba(255,190,110,.32),transparent 62%),radial-gradient(circle at 22% 28%,#8f775c 0,transparent 38%),radial-gradient(circle at 78% 64%,#6c5843 0,transparent 42%),radial-gradient(circle at 46% 92%,#54432f 0,transparent 48%),radial-gradient(circle at 88% 12%,#7c664d 0,transparent 30%),#735e47;
  box-shadow:inset 0 0 40px rgba(20,12,6,.7)}
.wall::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(255,170,90,.22),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(15,8,3,.6))}
.wall svg.rock{position:absolute;inset:0;width:100%;height:100%}
.wall svg.art{position:relative;width:84%;height:auto;mix-blend-mode:multiply}
.wall.sm{aspect-ratio:1;margin:0;border-radius:10px}
.wall.sm svg.art{width:94%}
.art .af{opacity:.88}
.art.draw .as,.art.draw .ao{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}
.art.draw .af{opacity:0;animation:fillin .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:.88}}
@media (prefers-reduced-motion:reduce){.art.draw *{animation:none!important;stroke-dashoffset:0!important;opacity:.88!important}}
/* --- illustrations des premières fois : scène peinte, cadre de papier --- */
.illus{position:relative;margin:4px 0 12px;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:#2a2118;box-shadow:0 0 0 1px var(--edge)}
.illus svg.ill{display:block;width:100%;height:100%}
.illus::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(40,24,10,.45))}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:6px}
.gallery figure{margin:0;display:grid;gap:4px;min-width:0}
.artbtn{display:block;text-align:left;border-radius:10px;min-width:0}
.artbtn:hover .wall,.artbtn:focus-visible .wall{box-shadow:inset 0 0 40px rgba(20,12,6,.7),0 0 0 2px var(--ochre)}
.wall.big{aspect-ratio:4/3;margin:6px 0 12px}
.wall.big svg.art{width:92%}
.gallery figcaption{font-size:12.5px;color:var(--bone-dim);line-height:1.3}
.gallery figcaption b{color:var(--bone);font-weight:700}

/* --- chronique --- */
#log{left:12px;top:70px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;max-width:min(420px,calc(100% - 24px));pointer-events:none}
#log li{font-size:13.5px;line-height:1.3;padding:5px 9px;border-radius:8px;background:rgba(20,15,10,.62);border-left:3px solid var(--bone-dim);transition:opacity 1.2s;text-wrap:pretty}
#log li time{color:var(--bone-dim);font-variant-numeric:tabular-nums;font-size:12px;margin-right:4px}
#log li.good{border-color:var(--moss)}#log li.bad{border-color:var(--ember)}#log li.power{border-color:var(--spirit)}#log li.know{border-color:var(--ochre)}
#log li.old{opacity:.38}

/* --- fiche villageois --- */
#card{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);width:min(290px,calc(100% - 24px));background:var(--bark);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* --- passage d'un âge à l'autre --- */
#eraT{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 50%,rgba(60,42,20,.55),rgba(10,7,4,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;animation:etFade 3.8s ease forwards}
#eraT .et-line{position:absolute;top:50%;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,var(--ochre),transparent);animation:etLine 3.8s ease-out forwards}
#eraT .et-prev,#eraT .et-next{position:absolute;font-family:var(--display);letter-spacing:.04em;text-align:center;width:90%}
#eraT .et-prev{font-size:clamp(20px,4vw,34px);color:var(--bone-dim);animation:etPrev 3.8s ease forwards}
#eraT .et-next{font-size:clamp(30px,7vw,64px);color:#f6dc8a;text-shadow:0 0 24px rgba(242,208,107,.7);opacity:0;animation:etNext 3.8s ease forwards}
#eraT .et-year{position:absolute;top:calc(50% + 56px);font-size:16px;color:var(--bone);opacity:0;animation:etYear 3.8s ease forwards}
#eraT .et-sparks i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#f6dc8a;box-shadow:0 0 8px #f2d06b;animation:etSpark 2.6s ease-out forwards;opacity:0}
@keyframes etFade{0%{opacity:0}10%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes etLine{0%{transform:scaleX(0)}40%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes etPrev{0%{transform:translate(0,-30px);opacity:0}15%{opacity:1;transform:translate(0,-30px)}45%{opacity:1;transform:translate(0,-30px)}70%{opacity:0;transform:translate(-40%,-30px)}100%{opacity:0}}
@keyframes etNext{0%,45%{opacity:0;transform:scale(.6)}65%{opacity:1;transform:scale(1.08)}75%,100%{opacity:1;transform:scale(1)}}
@keyframes etYear{0%,60%{opacity:0}75%,100%{opacity:1}}
@keyframes etSpark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70vh)}}
.eras{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.eras p{font-size:14px;line-height:1.45}
@media (max-width:560px){.eras{grid-template-columns:1fr}}
/* --- fiche bâtiment --- */
#bcard{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);width:min(340px,calc(100% - 24px));max-height:min(62vh,520px);overflow-y:auto;background:var(--bark);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#bcard .cid{display:flex;flex-direction:column}
#bcard h4{margin:10px 0 3px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--ochre)}
#bcard p{margin:0;font-size:14px;line-height:1.42;color:var(--bone)}
#bcard .tip{margin-top:10px}
#bcard .bwip,#bcard .bwho{margin-top:6px;color:var(--bone-dim);font-size:13px}
.ch{display:flex;align-items:center;gap:8px}
.ch b{font-family:var(--display);font-size:20px;letter-spacing:.03em}
.ch span{color:var(--bone-dim);font-size:13px}
.ch .sp{flex:1}
.ch button{font-size:13px;padding:5px 9px;border-radius:7px;border:1px solid var(--edge)}
.ch button.on{background:var(--ochre);color:#2a1c0c;border-color:var(--ochre)}
#ctask{margin:6px 0 10px;font-size:14px;color:var(--bone)}
#ctask em{font-style:normal;color:var(--blight);font-weight:700}
.meters{display:grid;grid-template-columns:auto 1fr 30px;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:rgba(240,230,208,.1);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.meters .v{text-align:right;color:var(--bone)}

/* --- pouvoirs --- */
#powers{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:var(--bark);border:1px solid var(--edge);border-radius:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pw{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;position:relative}
.pw svg.i{width:26px;height:26px}
.pw .nm{font-family:var(--display);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.pw .cost{font-size:11px;color:var(--spirit);font-variant-numeric:tabular-nums}
.pw[data-power="feu"] svg{color:var(--ember)}.pw[data-power="pluie"] svg{color:var(--spirit)}.pw[data-power="foudre"] svg{color:#e8e4a0}.pw[data-power="crue"] svg{color:#5fa8d3}.pw[data-power="fleurs"] svg{color:#e87aa0}.pw[data-power="tornade"] svg{color:#b8b4ac}.pw[data-power="tourbillon"] svg{color:#4fa3c8}.pw[data-power="benir"] svg{color:var(--gold)}.pw[data-power="gibier"] svg{color:var(--moss)}
.pw.armed{background:rgba(227,160,63,.2);box-shadow:inset 0 0 0 1.5px var(--ochre)}
.pw.poor{opacity:.42}
.pw.tech{margin-left:4px;border-left:1px solid var(--edge);border-radius:0 10px 10px 0;color:var(--ochre)}
.pw.tech .cost{color:var(--ochre)}
.badge{position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 2px var(--bark-solid)}
#hint{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:var(--bark);border:1px solid var(--ochre);color:var(--bone);border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.35;text-align:center;width:max-content;max-width:min(560px,calc(100% - 24px));pointer-events:none}
.tip{background:rgba(227,160,63,.1);border-left:3px solid var(--ochre);padding:8px 10px;border-radius:6px}
@media (max-width:600px){ .pw{width:44px}.pw .nm{display:none} }
@media (max-width:640px){ #top{display:flex;flex-wrap:wrap;gap:6px} .hudchips{display:contents} .speed{position:static;margin-left:auto} }
@media (max-width:440px){
  .pw svg.i{width:23px;height:23px}
  .chip{padding:6px 8px;gap:5px}.mbar{width:44px}
  #card{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
}

/* --- fenêtres --- */
#modal{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(12,9,6,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel{width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;background:var(--bark-solid);border:1px solid var(--edge);border-radius:16px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0 0 8px;letter-spacing:.02em;text-wrap:balance}
.panel p{margin:0 0 12px;line-height:1.45;color:var(--bone);text-wrap:pretty}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--ochre);margin:0 0 6px!important}
.sub{color:var(--bone-dim)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;background:var(--ochre);color:#2a1c0c;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.03em}
.btn.ghost{background:none;color:var(--bone);border:1px solid var(--edge)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.title{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,62px);line-height:.95;margin:0 0 10px;color:var(--ochre);letter-spacing:.01em}
.how{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:8px}
.how li{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;line-height:1.35}
.how li b{font-family:var(--display);color:var(--ochre);letter-spacing:.04em;font-weight:700}
.choices{display:grid;gap:8px;margin-top:6px}
.choice{text-align:left;padding:12px 14px;border-radius:10px;background:var(--bark-raised);border:1px solid var(--edge);display:grid;gap:3px}
.choice b{font-family:var(--display);font-size:17px;letter-spacing:.02em}
.choice span{font-size:13.5px;color:var(--bone-dim)}
.choice:hover:not([disabled]){border-color:var(--ochre)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.tier{margin-top:14px}
.tier h3{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--bone-dim);margin:0 0 7px;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tcard{text-align:left;display:flex;flex-direction:column;gap:4px;padding:10px 11px;border-radius:10px;background:var(--bark-raised);border:1px solid var(--edge);min-width:0}
.tcard .tn{font-family:var(--display);font-weight:700;font-size:16px}
.tcard .td{font-size:12.5px;line-height:1.3;color:var(--bone-dim);flex:1}
.tcard .tf{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tcard .timg{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:7px;margin-bottom:3px;background:#3a2e22}
.tcard.locked .timg{filter:grayscale(.8) brightness(.8)}
.tcard .ty{font-size:11.5px;color:var(--spirit);font-variant-numeric:tabular-nums}
/* --- âge et climat dans la barre du haut, frise de référence --- */
.c-era{flex-direction:column;align-items:flex-start;gap:2px;padding-block:5px}
.c-era b{font-family:var(--display);font-weight:700;letter-spacing:.02em;font-size:14px}
.c-era small{margin:0!important;color:var(--spirit)!important;font-size:11.5px}
.tl{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 11px;border-radius:10px;background:var(--bark-raised);border:1px solid var(--edge)}
.tl li b{font-family:var(--display);font-size:15.5px}
.tl li .d{font-size:12.5px;color:var(--bone-dim);font-variant-numeric:tabular-nums;text-align:right}
.tl li span:last-child{grid-column:1 / -1;font-size:13px;color:var(--bone-dim);line-height:1.35}
.tl li.now{border-color:var(--ochre);box-shadow:inset 0 0 0 1px var(--ochre)}
.tl li.now b::after{content:" · aujourd’hui";color:var(--ochre);font-size:12px;letter-spacing:.06em}
.vl small{font-weight:500;opacity:.85;margin-left:2px}
.tcard.done{border-color:rgba(156,192,97,.55)}.tcard.done .tf{color:var(--moss)}
.tcard.ready{border-color:var(--ochre);box-shadow:inset 0 0 0 1px var(--ochre)}.tcard.ready .tf{color:var(--ochre)}
.tcard.wait .tf{color:var(--bone-dim)}
.tcard.locked{opacity:.5}.tcard.locked .tf{color:var(--bone-dim);font-weight:500}
.tcard[aria-disabled="true"]{cursor:default}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.stats div{display:grid}.stats b{font-family:var(--display);font-size:26px;color:var(--ochre)}.stats span{font-size:12px;color:var(--bone-dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const T = THREE;
const $ = s => document.querySelector(s);

// ================= Constantes de jeu =================
const SEC_PER_HOUR = 3.5;          // secondes réelles par heure de jeu, à vitesse 1×
const YEARS_PER_DAY = 4;           // âge gagné par jour de jeu
const ADULT_AGE = 14;
const NIGHT_START = 21, NIGHT_END = 6;
// carte agrandie : le relief du village est inchangé jusqu'à 42 pas du centre (les anciennes parties restent intactes) ;
// au-delà, les montagnes reculent et laissent place à de nouvelles collines, forêts et lacs.
const WORLD = 240, HALF = WORLD / 2, SEG = 150;
const MTN_START = 62, MTN_END = 112, FLAT_IN = 5.1, FLAT_OUT = 18.7, LAND_R = 90;
const WORK_RADIUS = 64;            // rayon d'action autour du camp
const MAX_TREES = 440, MAX_BUSHES = 42, DOTS_PER_BUSH = 5, BERRY_MAX = 6;
const SAVE_KEY = 'premierFeu.save.v1';
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
const SAVED = loadSave();
const SEED = SAVED ? SAVED.seed : (Math.random() * 1e9) | 0;
// Calendrier historique : la tribu démarre en 40 000 av. J.-C. ; chaque savoir fait avancer l'époque.
const START_YEAR = -40000;
// le temps file moins vite à mesure que l'histoire s'accélère
const yearsPerHour = () => tech.rome ? 0.1 : tech.fer ? 0.25 : tech.bronze ? 0.4 : tech.cuivre ? 0.6 : tech.village ? 1.2 : 2;
// plafond de population (fluidité sur téléphone) ; les oppida de l'âge du fer permettent une vraie petite ville
// Antiquité : le village devient un vicus. Les vrais comptaient plusieurs centaines d'habitants ; chaque villageois étant
// simulé un à un, on en montre un échantillon, plafonné pour rester fluide sur tablette.
const popMax = () => tech.theatre ? 160 : tech.tuiles ? 130 : tech.pax ? 100 : tech.oppidum ? 80 : 60;
function yearText(y) { const a = Math.round(-y / 10) * 10; return a > 0 ? `${a.toLocaleString('fr-FR')} av. J.-C.` : `${(-a).toLocaleString('fr-FR')} apr. J.-C.`; }

const rr = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// ================= Bruit & relief =================
function hash(ix, iz) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
function fbm(x, z, oct) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, z * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }
const forestNoise = (x, z) => fbm(x * 0.05 + 3, z * 0.05 + 9, 2);
// Littoral : un côté de la carte s'ouvre sur la mer (côte découpée, plage en pente douce).
// Les anciennes sauvegardes, créées sans mer, gardent leur relief d'origine.
const COAST = SAVED ? !!SAVED.coast : true;
const COAST_DIR = hash(7, 11) * Math.PI * 2, COAST_X = Math.cos(COAST_DIR), COAST_Z = Math.sin(COAST_DIR);
function heightAt(x, z) {
  const d = Math.hypot(x, z);
  const h = (fbm(x * 0.035 + 11, z * 0.035 + 7, 4) - 0.42) * 11;
  const ridge = 1 - Math.abs(fbm(x * 0.05 + 40, z * 0.05 - 13, 3) * 2 - 1);
  let m = smooth(MTN_START, MTN_END, d) * (10 + ridge * 17);
  const f = smooth(FLAT_IN, FLAT_OUT, d);
  let y = h * f + 1.4 * (1 - f);
  if (COAST) {
    const along = x * COAST_X + z * COAST_Z, side = -x * COAST_Z + z * COAST_X;
    const line = 32 + (fbm(side * 0.04 + 50, 3.7, 3) - 0.5) * 22;
    y = lerp(y, -3.5, smooth(line - 4, line + 10, along)); m *= 1 - smooth(line - 12, line, along);
  }
  return y + m;
}
function validLand(x, z) { if (Math.hypot(x, z) > LAND_R) return false; const h = heightAt(x, z); return h > 0.35 && h < 11; }
function landPoint(x, z, r) {
  for (let k = 0; k < 14; k++) { const a = rr(0, Math.PI * 2), d = rr(r * 0.3, r); const px = x + Math.cos(a) * d, pz = z + Math.sin(a) * d; if (validLand(px, pz)) return { x: px, z: pz }; }
  return { x, z };
}

// ================= Moteur 3D =================
const canvas = $('#scene');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = new T.Color('#a8d4ea');
scene.fog = new T.Fog('#a8d4ea', 120, 310);
const camera = new T.PerspectiveCamera(50, 1, 0.5, 600);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  $('#log').style.top = ($('#top').getBoundingClientRect().bottom + 8) + 'px';
}
addEventListener('resize', resize);

const hemi = new T.HemisphereLight(0xd6ecff, 0x50602e, 0.6);
const sun = new T.DirectionalLight(0xfff1d6, 0.9);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 260 });
sun.shadow.bias = -0.0008;
scene.add(hemi, sun, sun.target);

const lam = c => new T.MeshLambertMaterial({ color: c });
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.4, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(c); })();
function merge(geos) {
  const gs = geos.map(g => g.index ? g.toNonIndexed() : g); let n = 0; gs.forEach(g => n += g.attributes.position.array.length);
  const pos = new Float32Array(n); let o = 0; for (const g of gs) { pos.set(g.attributes.position.array, o); o += g.attributes.position.array.length; }
  const r = new T.BufferGeometry(); r.setAttribute('position', new T.BufferAttribute(pos, 3)); r.computeVertexNormals(); return r;
}
const _m = new T.Matrix4(), _q = new T.Quaternion(), _s = new T.Vector3(), _p = new T.Vector3(), _v = new T.Vector3(), _c = new T.Color(), _c3 = new T.Color();
const SNOWY = new T.Color('#e6ece8'), BARE = new T.Color('#8c8656'), AUTUMN = new T.Color('#c27a32');
const UP = new T.Vector3(0, 1, 0);

// ================= Terrain & eau =================
const TC = { sand: new T.Color('#d9c48d'), g1: new T.Color('#8bbd52'), g2: new T.Color('#6fa441'), g3: new T.Color('#558f36'), forest: new T.Color('#427633'), rock: new T.Color('#8d8877'), rockD: new T.Color('#6e6a5d'), snow: new T.Color('#f2f1eb'), steppe: new T.Color('#aea677'), steppe2: new T.Color('#958f66'), tundra: new T.Color('#767a58') };
// On garde pour chaque facette ses données de base : le climat peut ainsi recolorier le relief (neiges, steppe, prairies).
let TFACE = null;
// Chemins : chaque pas use l'herbe ; les passages fréquents deviennent des sentiers, puis des chemins de terre,
// puis des chemins empierrés à l'âge du fer. Inutilisés, ils s'effacent lentement.
const WEAR_CELL = 1.6, WEAR_N = 80, wear = new Float32Array(WEAR_N * WEAR_N);
function wearCell(x, z) { const i = Math.floor(x / WEAR_CELL + WEAR_N / 2), j = Math.floor(z / WEAR_CELL + WEAR_N / 2); return i < 0 || j < 0 || i >= WEAR_N || j >= WEAR_N ? -1 : j * WEAR_N + i; }
const PATH_C = { trail: new T.Color('#9c8a5e'), dirt: new T.Color('#8f7350'), road: new T.Color('#9a9080') };
function buildTerrain() {
  const g = new T.PlaneGeometry(WORLD, WORLD, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  const geo = g.toNonIndexed(); geo.computeVertexNormals();
  const pos = geo.attributes.position, nor = geo.attributes.normal, nF = pos.count / 3;
  TFACE = { h: new Float32Array(nF), ny: new Float32Array(nF), v: new Float32Array(nF), f: new Float32Array(nF), j: new Float32Array(nF), cell: new Int32Array(nF) };
  for (let i = 0; i < nF; i++) {
    const a = i * 3, x = (pos.getX(a) + pos.getX(a + 1) + pos.getX(a + 2)) / 3, z = (pos.getZ(a) + pos.getZ(a + 1) + pos.getZ(a + 2)) / 3;
    TFACE.cell[i] = wearCell(x, z);
    TFACE.h[i] = (pos.getY(a) + pos.getY(a + 1) + pos.getY(a + 2)) / 3; TFACE.ny[i] = nor.getY(a);
    TFACE.v[i] = vnoise(x * 0.15, z * 0.15); TFACE.f[i] = forestNoise(x, z); TFACE.j[i] = 0.94 + Math.random() * 0.1;
  }
  geo.setAttribute('color', new T.BufferAttribute(new Float32Array(pos.count * 3), 3));
  const mesh = new T.Mesh(geo, new T.MeshLambertMaterial({ vertexColors: true }));
  mesh.receiveShadow = true; return mesh;
}
// c = 0 : maximum glaciaire (neige jusqu'au pied des montagnes, steppe jaunie) ; c = 1 : Holocène (prairies vertes)

const TECH = Object.fromEntries(TECHS.map(t => [t.id, t]));
const TIER_NAMES = ['', 'Paléolithique · Chasseurs-cueilleurs', 'Paléolithique · Artisans', 'Fin de la glaciation', 'Sédentarisation', 'Néolithique · Le village', 'Néolithique · Coutumes et ouvrages', 'Âge du cuivre', 'Âge du bronze', 'Âge du fer · Hallstatt', 'Âge du fer · Les Gaulois', 'Vers l’Antiquité', 'Antiquité · La Gaule romaine', 'Antiquité tardive'];
const ERAS = [['rome', 'Antiquité', 'dans l’Antiquité'], ['fer', 'Âge du fer', 'dans l’âge du fer'], ['bronze', 'Âge du bronze', 'dans l’âge du bronze'], ['cuivre', 'Âge du cuivre', 'dans l’âge du cuivre'], ['village', 'Néolithique', 'dans le Néolithique']];
function era() { for (const [id, n, into] of ERAS) if (tech[id]) return { n, into }; return Object.keys(tech).length >= 7 ? { n: 'Mésolithique', into: 'dans le Mésolithique' } : { n: 'Paléolithique supérieur', into: 'dans le Paléolithique supérieur' }; }
const eraName = () => era().n;
const canResearch = t => !tech[t.id] && t.req.every(r => tech[r]) && !(t.need && t.need()) && colony.know >= t.cost;
function research(id) {
  const t = TECH[id]; if (!t || !canResearch(t)) return;
  sfx(ERA_TEXT[id] || id === 'village' ? 'era' : 'tech');
  const eraBefore = eraName();
  colony.know -= t.cost; tech[id] = true; colony.lastTech = id; onPower('savoir', {});
  colony.year = Math.max(colony.year + (tech.pax ? 10 : 150), t.year);   // l'Antiquité est datée finement
  log(`La tribu découvre : ${t.name}. Nous voici en ${yearText(colony.year)}.`, 'know');
  const eraAfter = eraName();
  if (eraAfter !== eraBefore) log(`La tribu entre ${era().into}.`, 'know');
  manageSites();
  // changement d'âge : courte animation, puis l'écran qui raconte l'âge qui s'achève et celui qui commence ; la tribu fait la fête
  if (eraAfter !== eraBefore) {
    if (id === 'village') colony.won = true;
    eraTransition(eraBefore, eraAfter, () => { if (id === 'village') showVictory(eraBefore); else showEra(ERA_TEXT[id] ? id : null, eraBefore, eraAfter); if (started && villagers.length) startFestival(); });
    return;
  }
  if (ERA_TEXT[id]) { showEra(id); return; }
  openTech(true);
}

const cam = { tx: 0, tz: 4, dist: 32, yaw: 0.65, follow: false };
const keys = new Set();
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; keys.add(e.key.toLowerCase()); if (e.key === ' ') { setSpeed(speed ? 0 : savedSpeed || 1); e.preventDefault(); } if (e.key === 'Escape') disarm(); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
function camVectors() { const s = Math.sin(cam.yaw), c = Math.cos(cam.yaw); return { fx: -s, fz: -c, rx: c, rz: -s }; }
function panBy(dx, dy) { const k = cam.dist / innerHeight * 1.5, v = camVectors(); cam.tx += -v.rx * dx * k + v.fx * dy * k; cam.tz += -v.rz * dx * k + v.fz * dy * k; cam.follow = false; syncFollowBtn(); }
function updateCamera(dt) {
  const v = camVectors(), k = cam.dist * 0.9 * dt;
  let mx = 0, mz = 0;
  if (keys.has('arrowup') || keys.has('w') || keys.has('z')) { mx += v.fx; mz += v.fz; }
  if (keys.has('arrowdown') || keys.has('s')) { mx -= v.fx; mz -= v.fz; }
  if (keys.has('arrowleft') || keys.has('a') || keys.has('q')) { mx -= v.rx; mz -= v.rz; }
  if (keys.has('arrowright') || keys.has('d')) { mx += v.rx; mz += v.rz; }
  if (mx || mz) { cam.tx += mx * k; cam.tz += mz * k; cam.follow = false; syncFollowBtn(); }
  if (keys.has('e')) cam.yaw -= dt * 1.5; if (keys.has('r')) cam.yaw += dt * 1.5;
  if (keys.has('t')) cam.tilt = (cam.tilt || 0) + dt * 0.9; if (keys.has('g')) cam.tilt = (cam.tilt || 0) - dt * 0.9;
  if (cam.follow && selected) { const a = 1 - Math.exp(-dt * 5); cam.tx = lerp(cam.tx, selected.x, a); cam.tz = lerp(cam.tz, selected.z, a); }
  const r = Math.hypot(cam.tx, cam.tz); if (r > 90) { cam.tx *= 90 / r; cam.tz *= 90 / r; }
  cam.dist = clamp(cam.dist, 8, 130);
  // inclinaison : angle automatique selon le zoom, corrigé par le joueur (cam.tilt), de presque l'horizon à presque vue du dessus
  const auto = lerp(0.5, 1.12, clamp((cam.dist - 8) / 80, 0, 1)), pitch = clamp(auto + (cam.tilt || 0), 0.16, 1.45);
  cam.tilt = pitch - auto;
  const ty = Math.max(heightAt(cam.tx, cam.tz), 0);
  camera.position.set(cam.tx + Math.sin(cam.yaw) * Math.cos(pitch) * cam.dist, ty + Math.sin(pitch) * cam.dist, cam.tz + Math.cos(cam.yaw) * Math.cos(pitch) * cam.dist);
  const gy = Math.max(heightAt(camera.position.x, camera.position.z), 0) + 2; if (camera.position.y < gy) camera.position.y = gy;
  camera.lookAt(cam.tx, ty + 0.6, cam.tz);
}
const ptrs = new Map(); let tap = null, pinch = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (e.button === 1) e.preventDefault();   // bouton du milieu : pas de défilement automatique du navigateur
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  if (ptrs.size === 1) tap = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
  else { tap = null; pinch = pinchState(); }
});
function pinchState() { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap = null;
  if (ptrs.size === 1) {
    if (tap) return;
    if (p.btn === 1) cam.tilt = (cam.tilt || 0) + dy * 0.006;                                   // bouton du milieu : incliner
    else if (p.btn === 2 || e.shiftKey) { cam.yaw -= dx * 0.006; cam.tilt = (cam.tilt || 0) + dy * 0.006; }   // clic droit : tourner et incliner
    else panBy(dx, dy);
  }
  else if (ptrs.size === 2 && pinch) {
    const n = pinchState();
    if (n.d > 10 && pinch.d > 10) cam.dist *= pinch.d / n.d;
    let da = n.ang - pinch.ang; if (da > Math.PI) da -= Math.PI * 2; if (da < -Math.PI) da += Math.PI * 2;
    // deux doigts : pincer pour zoomer, tourner pour pivoter, glisser ensemble vers le haut ou le bas pour incliner
    cam.yaw -= da; cam.tilt = (cam.tilt || 0) + (n.my - pinch.my) * 0.007; pinch = n;
  }
});
function endPtr(e) {
  if (tap && tap.id === e.pointerId && performance.now() - tap.t < 500) handleTap(e.clientX, e.clientY);
  tap = null; ptrs.delete(e.pointerId); pinch = ptrs.size === 2 ? pinchState() : null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', e => { tap = null; ptrs.delete(e.pointerId); pinch = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });

const raycaster = new T.Raycaster(), ndc = new T.Vector2();
function groundPoint(sx, sy) { ndc.set(sx / innerWidth * 2 - 1, -(sy / innerHeight) * 2 + 1); raycaster.setFromCamera(ndc, camera); const hit = raycaster.intersectObject(terrain)[0]; return hit ? hit.point : null; }
function pickVillager(sx, sy) {
  let best = null, bd = 34 * 34;
  for (const v of villagers) { if (!v.mesh.visible) continue; _v.set(v.x, v.mesh.position.y + 0.7, v.z).project(camera); if (_v.z > 1) continue; const px = (_v.x + 1) / 2 * innerWidth, py = (1 - _v.y) / 2 * innerHeight; const d = (px - sx) ** 2 + (py - sy) ** 2; if (d < bd) { bd = d; best = v; } }
  return best;
}
function handleTap(sx, sy) {
  if (armed) {
    const p = groundPoint(sx, sy); if (!p) return;
    const pw = POWERS[armed];
    if (colony.mana < pw.cost) { showHint(`Pas assez de mana pour ${pw.name} (${pw.cost}).`, 1800); return; }
    const why = pw.can && pw.can(p.x, p.z); if (why) { showHint(why, 2400); return; }
    // on mesure l'effet du pouvoir pour la quête en cours (malades guéris, pillards frappés, foyer rallumé…)
    const sick0 = villagers.filter(v => v.sick).length, fallen0 = raid ? raid.fallen : 0, lit0 = colony.fireLit, kind = armed;
    const adults = villagers.filter(v => v.adult && Math.hypot(v.x - p.x, v.z - p.z) < 8).length;
    colony.mana -= pw.cost; pw.cast(p.x, p.z); disarm(); hud();
    onPower(kind, { x: p.x, z: p.z, cured: sick0 - villagers.filter(v => v.sick).length, raiders: (raid ? raid.fallen : fallen0) - fallen0, relit: !lit0 && colony.fireLit, adults });
    return;
  }
  const pv = pickVillager(sx, sy);
  if (pv) { select(pv); return; }
  const an = pickAnimal(sx, sy);
  if (an) { openBuilding(an, null, AINFO[an] ? 'a' : 'b'); return; }
  const p = groundPoint(sx, sy);
  if (p) {
    if (raiders.some(r => r.alive && Math.hypot(r.x - p.x, r.z - p.z) < 3)) { showHint('Un pillard ! Le pouvoir Feu peut aider les défenseurs.', 2400); return; }
    const c = caves.find(c => Math.hypot(c.cx - p.x, c.cz - p.z) < 4.5);
    if (c) { openCave(caves.indexOf(c)); return; }
    const f = fields.find(f => Math.hypot(f.x - p.x, f.z - p.z) < 2.8);
    if (f) { openBuilding(f.crop || 'ble', f, 'c'); return; }
    const b = pickBuilding(p);
    if (b) { openBuilding(b[0], b[1]); return; }
  }
  select(null);
}

let selected = null, armed = null, modalOpen = false, hintTimer = 0;
const logEl = $('#log');
function log(msg, kind = '') {
  const li = document.createElement('li'); li.className = kind;
  li.innerHTML = `<time>J${dayNum()} ${String(Math.floor(hourOfDay())).padStart(2, '0')}h</time>${msg}`;
  logEl.prepend(li); while (logEl.children.length > 5) logEl.lastChild.remove();
  setTimeout(() => li.classList.add('old'), 14000);
}
function showHint(text, ms) { const h = $('#hint'); h.textContent = text; h.hidden = false; clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => { h.hidden = true; if (armed) armHint(); }, ms); }
function armHint() { const pw = POWERS[armed]; showHint(`${pw.name} (${pw.cost} mana) : ${pw.desc} Touchez le terrain pour le lancer.`); }
function disarm() { armed = null; document.querySelectorAll('.pw.armed').forEach(b => b.classList.remove('armed')); $('#hint').hidden = true; }
document.querySelectorAll('.pw[data-power]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.power; if (armed === k) { disarm(); return; }
  const why = POWERS[k].can && POWERS[k].can(); if (why) { disarm(); showHint(why, 2400); return; }
  disarm(); armed = k; b.classList.add('armed'); armHint();
}));
$('#techbtn').addEventListener('click', () => { disarm(); openTech(); });
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
function setSpeed(s) { speed = s; if (s > 0) savedSpeed = s; document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === s)); }
function select(v) { selected = v; $('#card').hidden = !v; selRing.visible = !!v; if (!v) cam.follow = false; syncFollowBtn(); if (v) updateCard(); if (v) $('#bcard').hidden = true; }

// ---- statistiques : pyramide des âges, courbe de population, démographie des défunts, métiers ----
function pyramidSVG() {
  const B = 5, N = 15, W = 300, rowH = 13, H = N * rowH + 22, mid = W / 2, half = mid - 38;   // marge pour les effectifs en bout de barre
  const m = new Array(N).fill(0), f = new Array(N).fill(0);
  for (const v of villagers) { const i = Math.min(N - 1, Math.floor(v.age / B)); (v.sex === 'F' ? f : m)[i]++; }
  const mx = Math.max(1, ...m, ...f);
  let s = '';
  for (let i = 0; i < N; i++) {
    const y = H - 22 - (i + 1) * rowH + 1, wm = m[i] / mx * half, wf = f[i] / mx * half;
    s += `<rect x="${(mid - 20 - wm).toFixed(1)}" y="${y}" width="${wm.toFixed(1)}" height="${rowH - 2}" rx="2" fill="#86c6d4"/><rect x="${mid + 20}" y="${y}" width="${wf.toFixed(1)}" height="${rowH - 2}" rx="2" fill="#e3a03f"/>`;
    s += `<text x="${mid}" y="${y + rowH - 4}" font-size="8.5" text-anchor="middle" fill="#cbbfa8">${i === N - 1 ? '70+' : i * B}</text>`;
    if (m[i]) s += `<text x="${(mid - 24 - wm).toFixed(1)}" y="${y + rowH - 4}" font-size="8" text-anchor="end" fill="#86c6d4">${m[i]}</text>`;
    if (f[i]) s += `<text x="${(mid + 24 + wf).toFixed(1)}" y="${y + rowH - 4}" font-size="8" fill="#e3a03f">${f[i]}</text>`;
  }
  s += `<text x="${mid - 24}" y="${H - 6}" font-size="10" text-anchor="end" fill="#86c6d4">Hommes ${m.reduce((a, b) => a + b, 0)}</text><text x="${mid + 24}" y="${H - 6}" font-size="10" fill="#e3a03f">Femmes ${f.reduce((a, b) => a + b, 0)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Pyramide des âges">${s}</svg>`;
}
function popCurveSVG() {
  const h = colony.hist || []; if (h.length < 2) return '<p class="sub">La courbe apparaîtra après quelques jours.</p>';
  const W = 300, H = 90, mx = Math.max(4, ...h.map(p => p[1])), n = h.length - 1;
  const pts = h.map((p, i) => `${(8 + i / n * (W - 16)).toFixed(1)},${(H - 14 - p[1] / mx * (H - 26)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Population au fil des jours"><polyline points="${pts}" fill="none" stroke="#e3a03f" stroke-width="2" stroke-linejoin="round"/><text x="8" y="10" font-size="9" fill="#cbbfa8">${mx} hab.</text><text x="8" y="${H - 2}" font-size="9" fill="#cbbfa8">jour ${h[0][0]}</text><text x="${W - 8}" y="${H - 2}" font-size="9" text-anchor="end" fill="#cbbfa8">jour ${h[n][0]}</text></svg>`;
}

  'harvest': ['La première moisson', 'Le blé amidonnier et l’orge, domestiqués au Croissant fertile vers 9500 av. J.-C., sont arrivés en Europe avec les premiers paysans.', 8],
  'hunt:cerf': ['La première chasse', 'Le cerf donne la viande, la peau, les tendons pour les liens et ses bois pour façonner des outils.', 8],
  'hunt:mammouth': ['La chasse au mammouth', 'Il faut plusieurs chasseurs armés de sagaies à pointe de silex. Un seul mammouth nourrit la tribu pendant des semaines, et ses os servent même à bâtir des huttes.', 13],
  'hunt:rhino': ['Le rhinocéros laineux', 'Deux cornes, une épaisse toison : un animal massif et dangereux, peint à Chauvet il y a plus de 30 000 ans.', 11],
  'hunt:aurochs': ['La chasse à l’aurochs', 'Près de deux mètres au garrot : l’aurochs est l’ancêtre sauvage de nos vaches, domestiqué au Proche-Orient vers 8500 av. J.-C.', 11],
  'birth': ['Le premier enfant du camp', 'Chez les chasseurs-cueilleurs, une femme a en moyenne un enfant tous les trois ou quatre ans : la tribu grandit lentement.', 5],
  'tools:cuivre': ['Les premiers outils de métal', 'Haches et poinçons de cuivre : un métal encore mou, mais qu’on peut refondre et réparer.', 7],
  'tools:bronze': ['Les outils de bronze', 'Neuf parts de cuivre pour une part d’étain : le bronze est bien plus dur et se coule dans des moules.', 7],
  'tools:fer': ['Les outils de fer', 'Le minerai de fer se trouve presque partout : socs, haches et épées deviennent accessibles à tous.', 7],
  'chief': ['Le premier chef de village', 'Dans les villages néolithiques, un chef ou un conseil d’anciens règle les conflits et organise les grands travaux. À l’âge du bronze, ce pouvoir s’appuie sur le contrôle du métal ; chez les Gaulois, un magistrat élu pour un an, le vergobret, gouverne la cité.', 12],
  'extinct:mammouth': ['La fin des mammouths', 'Avec le réchauffement, la steppe froide cède la place à la forêt : les mammouths perdent leurs pâturages, et les chasseurs les traquent. Ils disparaissent d’Europe vers 12 000 av. J.-C. Les derniers survivront sur l’île Wrangel, en Sibérie, jusque vers 2000 av. J.-C.', 12],
  'extinct:rhino': ['La fin du rhinocéros laineux', 'Adapté au grand froid, le rhinocéros laineux disparaît d’Europe à la fin de la glaciation, il y a environ 14 000 ans. On ne le connaît plus que par ses ossements, quelques corps gelés en Sibérie et les peintures de Chauvet.', 12],
  'build:domus': ['La première maison de pierre', 'Murs de moellons enduits à la chaux, toit de tuiles plates et de tuiles rondes, petite galerie à colonnes : en quelques générations, les maisons de la Gaule romaine troquent le chaume contre la tuile.', 10],
  'build:fanum': ['Le fanum', 'Une tour carrée, la cella, entourée d’une galerie : ce plan de temple n’existe qu’en Gaule et en Bretagne romaines. On y honore ensemble les dieux gaulois et romains, comme Mercure ou Apollon.', 11],
  'build:thermes': ['Les thermes', 'Une salle froide, une tiède, une chaude chauffée par le sol (l’hypocauste) : on y vient se laver, se masser, discuter. Même les petites agglomérations de Gaule ont leurs bains publics.', 11],
  'build:theatre': ['Le théâtre', 'En Gaule, les théâtres accompagnent souvent les grands sanctuaires de campagne, comme à Gennes en Anjou : on y donne des fêtes religieuses, des chants, des combats et des pantomimes.', 11],
  'build:church': ['La première église', 'Évêque de Tours à partir de 371, saint Martin parcourt les campagnes, détruit les temples païens et fonde des églises. Le christianisme devient la religion de l’Empire en 380.', 11],
  'build:voie': ['La voie romaine', 'Un lit de pierres et de graviers bombé, bordé de fossés : les voies relient les villes de la Gaule. Tous les mille pas, une borne milliaire indique la distance et le nom de l’empereur.', 10],
  'build:castrum': ['Le castrum', 'Après les invasions de 275-276, les villes de Gaule se replient derrière des murailles neuves, bâties à la hâte avec des pierres de monuments démolis, flanquées de tours rondes et chaînées de brique.', 11],
  'center:place': ['La place publique', 'Le feu de camp a cédé la place à une grande place : chaque maison a désormais son foyer. Au cœur des oppida, on se retrouve pour commercer, juger et fêter. À Bibracte, un grand bassin de pierre trônait au milieu de la voie principale.', 11],
  'center:forum': ['Le forum', 'Le cœur de la ville romaine : une place dallée bordée de portiques, avec la basilique où l’on rend la justice et traite les affaires, et un temple. Même les petites villes de Gaule ont le leur.', 11],
  'cave:bergerie': ['La grotte devient bergerie', 'Les maisons suffisent désormais à loger tout le monde : on ne dort plus dans les grottes. Au Néolithique, les bergers du Midi y abritent leurs chèvres et leurs moutons ; à Fontbrégoua, en Provence, des couches de fumier fossile en témoignent encore.', 10],
  'cave:reserve': ['La grotte devient réserve', 'Plus personne n’y dort : la grotte, fraîche et sèche, sert désormais à entreposer jarres de grain, viande fumée et outils.', 8],
  'cave:sepulture': ['La grotte des ancêtres', 'Dès le Néolithique moyen, on dépose les morts ensemble dans des grottes, génération après génération. La grotte ornée devient le lieu des ancêtres.', 10],
  'sea:baleine': ['La baleine grise', 'Un souffle au large : c’est la baleine grise de l’Atlantique. Il y a 20 000 ans déjà, les chasseurs du golfe de Gascogne taillaient des outils dans les os de grandes baleines. Chassée au Moyen Âge, elle disparaît de nos côtes au XVe siècle et ne vit plus aujourd’hui que dans le Pacifique.', 10],
  'sea:pingouin': ['Le grand pingouin', 'Haut de 80 cm, incapable de voler mais excellent nageur, il niche en colonies sur les côtes. Des hommes l’ont peint dans la grotte Cosquer, près de Marseille, il y a plus de 20 000 ans. Massacré pour sa chair, sa graisse et ses plumes, il s’éteint en 1844 : le dernier couple est tué en Islande.', 10],
  'sea:phoque': ['Les phoques', 'Des phoques se reposent sur la grève. Les chasseurs les guettent pour leur viande, leur graisse et leur peau. La grotte Cosquer en montre plusieurs, et même un être à corps d’homme et à tête de phoque.', 9],
  'sea:esturgeon': ['L’esturgeon', 'Jusqu’à 3 mètres et plus de 300 kilos : l’esturgeon remonte les grands fleuves comme la Loire pour pondre, et bondit parfois hors de l’eau. Surpêché pour sa chair et ses œufs, le caviar, puis coupé de ses frayères par les barrages, il ne subsiste plus en France que dans le bassin de la Gironde.', 9],
  'sea:espadon': ['L’espadon', 'Un éclair bleu jaillit des vagues : un espadon ! Ce grand poisson de l’Atlantique, qui peut dépasser 3 mètres, remonte l’été jusque dans le golfe de Gascogne pour chasser maquereaux et calmars.', 7],
  'sea:dauphin': ['Les dauphins', 'Un groupe de dauphins bondit au large. Grands dauphins et dauphins communs fréquentent le golfe de Gascogne depuis toujours, à la poursuite des bancs de sardines et de maquereaux.', 8],
  'sky:grues': ['Le passage des migrateurs', 'Un grand V traverse le ciel : oies sauvages et grues migrent vers le nord au printemps, vers le sud à l’automne. Leur passage annonce le changement de saison.', 8],
  'druid': ['Le premier druide', 'D’après César, les druides sont à la fois prêtres, juges et savants. Leur savoir ne s’écrit pas : ils l’apprennent par cœur, parfois pendant vingt ans. Ils sont dispensés de la guerre. Pline raconte qu’ils cueillent le gui du chêne avec une serpe d’or.', 10],
  'feast': ['La fête des moissons', 'Après la récolte, on partage le pain et la viande, on chante et on danse : ces fêtes soudent le village.', 10],
  'raid': ['Les pillards repoussés', 'Au Néolithique et à l’âge du bronze, les conflits entre villages sont bien réels, comme le montre le charnier de Talheim (vers 5000 av. J.-C.).', 8],

  let msg = '';

  else if (kind === 'tornade' && info.raiders > 0) { msg = 'Grâce à toi, la tornade balaie les pillards ! La tribu crie au miracle.'; colony.mood += 6; }
  else if (kind === 'crue' && info.raiders > 0) { msg = 'Grâce à toi, la rivière se soulève et emporte les pillards ! La tribu crie au miracle.'; colony.mood += 6; }
